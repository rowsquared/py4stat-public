# Data Catalog: Datania Quarterly Labour Force Survey

raw_households_sample:
  path: data/0_raw/datania_households_sample.csv
  format: csv
  description: Raw sample of Datania households
  read_only: true
  dtypes:
    hh_id: str
    province_code: str
    province_name: str
    district: str
    urban_rural: str
    hh_size: int
    income_dkw: float
  parse_dates:
    - survey_date


